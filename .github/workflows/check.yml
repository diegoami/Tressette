# The engine tests, on every push and every pull request. There is nothing to
# install: the engine and its tests have no dependencies, which is the point.
#
# The UI check is the second job. It is the one thing here that is not
# dependency-free: it needs playwright-core and a Chromium.
name: check

# push is filtered to main: without the filter every commit on a pull request
# branch runs the suite twice, once for the push and once for the pull request,
# and one of those runs downloads a Chromium.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      # The whole history, tags included: release.test.mjs measures versionCode
      # against the previous milestone tag, and a shallow clone has none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node 24, the line the releases are built with here. `lts/*` moved to
      # whatever the newest LTS was on the day, so a new major could change the
      # test runner or the UI check under a green history without a commit to
      # show for it. The major is pinned and patches still arrive; moving to the
      # next line is a commit here, in both jobs.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Not `--test tools/`: Node 22 reads a bare directory as a module path and
      # fails with MODULE_NOT_FOUND. A glob is what Node 24 discovers.
      # No install first: the engine and its tests still have no dependencies.
      - run: node --test 'tools/**/*.test.mjs'

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # as in the engine job
      # playwright-core is the one dependency this repo has, and it is a dev
      # one: it belongs to the check, not to the game. `npm ci` restores the
      # exact version the lockfile names, so CI and a local run measure the
      # page with the same browser build. --with-deps is what makes Chromium
      # start on a bare runner.
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check
