# The site is plain static files — no build step. Everything that should be on
# the web lives in public/, and nothing else is published: the repo root holds
# PLAN.md, AGENTS.md, the tooling and this file, none of which belong on a
# public URL. Publishing "." served SPEC.md and ROADMAP.md from Discola's
# private repo; this repo's root is documents almost entirely.
[build]
  publish = "public"

# The self-hosted fonts are a subset cut once and never edited; like the decks
# they never change while they keep their names, so cache them hard too.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The icons are cut from a deck sheet and change as rarely.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Android build. /android points at the latest GitHub release rather than a
# versioned asset URL, so the link survives every release; the release page also
# carries the notes and the checksum, which is where somebody about to sideload
# an APK should land. Built and published outside Netlify — see ANDROID.md.
[[redirects]]
  from = "/android"
  to = "https://github.com/diegoami/tressette-releases/releases/latest"
  status = 302
  force = true

# The Windows build, the same way: one release carries both files, so the same
# latest-release page serves either. Built and published outside Netlify too;
# see DESKTOP.md.
[[redirects]]
  from = "/windows"
  to = "https://github.com/diegoami/tressette-releases/releases/latest"
  status = 302
  force = true

# The deck sprite sheets are the original 1997 bitmaps and never change once a
# deck is packed, so they can be cached hard. The page itself must not be, or
# players keep an old build after a deploy.
[[headers]]
  for = "/decks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
